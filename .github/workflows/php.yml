name: Continuous Integration
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read
    checks: write # Needed for test results

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - php: "8.1"
                      dependencies: update
                    - php: "8.2"
                      dependencies: update
                    - php: "8.3"
                      dependencies: update
                    - php: "8.4"
                      dependencies: update
                    - php: "8.5"
                      dependencies: install
        name: PHP ${{ matrix.php }} (composer ${{ matrix.dependencies }})
        steps:
            - uses: actions/checkout@v4

            - name: Set up PHP ${{ matrix.php }}
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Validate composer.json and composer.lock
              run: composer validate

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json', 'composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependencies }}-

            - name: Install committed dependencies
              if: matrix.dependencies == 'install'
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Resolve dependencies for PHP ${{ matrix.php }}
              if: matrix.dependencies == 'update'
              run: composer update --prefer-dist --no-progress --no-interaction

            - name: Verify committed lockfile is unchanged
              if: matrix.dependencies == 'install'
              run: git diff --exit-code -- composer.lock

            - name: Run ParaTest tests
              run: vendor/bin/paratest --configuration=phpunit.xml --processes=2
